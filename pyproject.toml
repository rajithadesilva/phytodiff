[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomato-parametric-reconstruction"
version = "0.1.0"
description = "Diffusion-based parametric reconstruction of tomato plants from 3D scans"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "hydra-core==1.3.2",
  "networkx==3.3",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "scipy==1.13.1",
  "torch==2.3.1",
]

[project.optional-dependencies]
usd = ["usd-core==24.8"]
dev = ["pytest==8.3.2", "pytest-cov==5.0.0", "ruff==0.6.4"]
visualisation = ["matplotlib==3.9.2"]
tomatowur = ["pandas==2.2.2"]

[project.scripts]
tomato-recon = "tomato_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

