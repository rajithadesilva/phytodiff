seed: 42

paths:
  output_root: outputs

model:
  encoder:
    name: kpconvx
    pretrained: false
    input_dim: 6
    output_dim: 96
    global_dim: 128
    num_semantic_classes: 5
    pretrained_checkpoint: null
    checkpoint: outputs/stage1_benchmark/combined/kpconvx/best.ckpt
    grid_size: 0.005
    shell_sizes: [1, 14, 28]
    layer_blocks: [2, 2, 2, 8, 2]
    init_channels: 32
    channel_scaling: 1.41421356237
    radius_scaling: 2.2
    neighbor_limits: [12, 16, 20, 20, 20]
    kernel_radius: 2.3
    attention_groups: 8
  diffusion:
    max_nodes: 256
    hidden_dim: 128
    layers: 3
    heads: 4
    local_neighbors: 16
    train_timesteps: 1000
    sample_steps: 50
    scheduler: ddim
    existence_threshold: 0.5
    nms_distance_m: 0.006
    min_nodes: 2
    freeze_encoder: true
    checkpoint: null
  graph:
    hidden_dim: 128
    knn_candidates: 12
    max_edge_length_m: 0.08
    enforce_botanical_constraints: true
    checkpoint: null
  parametric:
    hidden_dim: 96
    leaf_mode: width_profile
    fruit_mode: pseudo_optional
    radial_segments: 8
    curve_samples: 12
    checkpoint: null

fruit:
  enabled: true
  pseudo_labels_dir: outputs/fruit_pseudo
  min_confidence: 0.70
  loss_weight: 0.20
  include_in_primary_metrics: false

trainer:
  devices: 1
  max_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  fast_dev_run: false
  deterministic: true
  num_workers: 0
  batch_size: 1
  validation_split: val

inference:
  num_diffusion_samples: 1
  seed: ${seed}
  continuous_refinement_steps: 0

input:
  path: null

output:
  dir: outputs/inference

export:
  usd: true
  meters_per_unit: 1.0
  up_axis: Z
  include_skeleton: true
  include_collisions: false
  include_context_pole: false
  write_debug_usda: true
